[project]
name = "niyam"
version = "0.1.0"
description = "Grounded question answering over RBI and SEBI regulations"
readme = "README.md"
authors = [
    { name = "Musharraf-Bubere", email = "musharrafbubere007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
niyam = "niyam:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
